[project]
name = "shortmaker"
version = "1.0.0"
description = "Convert YouTube videos into viral short clips with AI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "yt-dlp>=2024.1.21",
    "openai-whisper>=20231117",
    "python-multipart>=0.0.6",
    "google-api-python-client>=2.169.0",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.2",
    "google-auth-httplib2>=0.2.0",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.10.1",
    "psycopg[binary]>=3.2.6",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "torch>=2.1.0,<2.5",
    "torchaudio>=2.1.0,<2.5",
    "numpy<2.0",
]

[project.scripts]
shortmaker = "backend.main:app"

[tool.uv]
dev-dependencies = []
